<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設備データ 受信アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <header class="app-header">
            <div>
                <h1>設備データ 受信アプリ</h1>

                <p class="plc-info">
                    PLC IPアドレス:
                    <span id="plc-ip">192.168.8.1</span>
                </p>
            </div>

            <div class="status-badge">
                <span class="status-dot"></span>
                <strong id="status">停止中</strong>
            </div>
        </header>


        <section class="control-panel">
            <div class="control-item">
                <label for="save-mode-select">
                    保存形式
                </label>

                <select id="save-mode-select">
                    <option value="sqlite" selected>SQLite</option>
                    <option value="csv">CSV</option>
                </select>
            </div>

            <div class="control-item">
                <label for="data-select">
                    表示データ
                </label>

                <select id="data-select">
                    <option value="all">すべて</option>
                </select>
            </div>

            <div class="control-buttons">
                <button id="start-button" type="button">
                    監視開始
                </button>

                <button id="stop-button" type="button" disabled>
                    監視停止
                </button>
            </div>
        </section>


        <section class="chart-card">
            <div class="chart-header">
                <div>
                    <span class="chart-label">表示データ</span>
                    <strong id="chart-data">未受信</strong>
                </div>

                <div class="measured-at">
                    <span class="chart-label">取得日時</span>
                    <strong id="measured-at">-</strong>
                </div>
            </div>

            <div class="chart-container">
                <canvas id="data-chart"></canvas>
            </div>

            <div class="history-buttons">
                <button id="oldest-button" type="button">
                    |&lt;
                </button>

                <button id="previous-button" type="button">
                    &lt;
                </button>

                <button id="next-button" type="button">
                    &gt;
                </button>

                <button id="latest-button" type="button">
                    &gt;|
                </button>
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
